name: Agent triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const i = context.payload.issue;
            const text = `${i.title}\n${i.body || ""}`;
            const fromAgent = /AI agent|\[agent\]/i.test(text) || i.labels.some(l => l.name === "agent-submitted");
            const labels = ["triage"];
            if (fromAgent) labels.push("agent-submitted");
            await github.rest.issues.addLabels({ ...context.repo, issue_number: i.number, labels });
            if (fromAgent) await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
              body: "Thanks. This was received and labelled `agent-submitted`; a maintainer will triage it. Agent manual: https://universal-coordinate-foundation.lovable.app/agents.md" });
